# Copy to .github/workflows/blocked-names-audit.yml. Replace PORTFOLIO_CI_SHA.
# Weekly full-history audit: every branch, tag, commit message and file version.
name: blocked-names-audit

on:
  schedule:
    - cron: "45 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: ZakJRademacher/portfolio-ci/.github/workflows/blocked-names.yml@PORTFOLIO_CI_SHA # v1.0.0
    with:
      scope: history
      require-lists: true
    secrets:
      blocked-names: ${{ secrets.PORTFOLIO_BLOCKED }}
      blocked-stems: ${{ secrets.PORTFOLIO_BLOCKED_STEMS }}
