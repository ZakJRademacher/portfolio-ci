# Copy to .github/dependabot.yml. Keeps SHA-pinned actions and the portfolio-ci
# workflow pins current: Dependabot updates the SHA and the "# vX.Y.Z" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
